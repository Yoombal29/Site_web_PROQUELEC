name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
      - '__tests__/**'
      - 'docs/**'

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=basic

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_ENV: ${{ github.event.inputs.environment || 'production' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            cd /var/www/proquelec

            # Pull latest changes
            git pull origin main

            # Install dependencies
            npm ci --production

            # Run database migrations
            npm run migrate:auto

            # Build application
            npm run build

            # Restart services
            pm2 restart proquelec-app || pm2 start server/index.js --name proquelec-app
            pm2 save

            # Verify deployment
            sleep 3
            curl -f http://localhost:5175/api/health || exit 1

            echo "✅ Deployment completed successfully!"

      - name: Health Check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 5
          echo "✅ Deployment verification passed"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Deployment failed!** Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
