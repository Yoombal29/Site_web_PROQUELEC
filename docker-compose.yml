services:
  # --- CORE APPLICATION (NODE.JS + REACT) ---
  app-backend:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@db:5432/proquelec}
    ports:
      - '${SITE_APP_PORT:-3000}:3000'
    working_dir: /app
    command: npm start
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=proquelec
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${SITE_DB_PORT:-5436}:5432'

volumes:
  pgdata:
