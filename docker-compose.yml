services:
  # --- CORE APPLICATION (NODE.JS + REACT) ---
  app-backend:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@db:5432/proquelec}
    ports:
      - '${SITE_APP_PORT:-3000}:3000'
    working_dir: /app
    command: npm start
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=proquelec
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${SITE_DB_PORT:-5436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
